server {
    listen 80;
    # Also bind IPv6: inside the container "localhost" resolves to ::1 first,
    # so an IPv4-only listener makes any localhost healthcheck or probe fail
    # with "connection refused" even though the site serves fine.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API access in production -- no CORS needed in the browser.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
